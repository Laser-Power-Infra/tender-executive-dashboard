services:
  laser-tender:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laser-tender
    ports:
      - "3126:3126"

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: 3126
      HOSTNAME: 0.0.0.0

      # GOOGLE_CLIENT_EMAIL: ${GOOGLE_CLIENT_EMAIL}
      # GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY}
      # DATABASE_URL: ${DATABASE_URL}

      # SMARTSHEET_API_TOKEN: ${SMARTSHEET_API_TOKEN}
      # SMARTSHEET_SHEET_ID: ${SMARTSHEET_SHEET_ID}

      # OPENAI_API_KEY: ${OPENAI_API_KEY}

      # GDRIVE_CLIENT_EMAIL: ${GDRIVE_CLIENT_EMAIL}
      # GDRIVE_PRIVATE_KEY: ${GDRIVE_PRIVATE_KEY}
      # GOOGLE_SPREADSHEET_ID: ${GOOGLE_SPREADSHEET_ID}
      # GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL}

      # N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      # N8N_WEBHOOK_URL_TEST: ${N8N_WEBHOOK_URL_TEST}
      # N8N_EMD_WEBHOOK_URL: ${N8N_EMD_WEBHOOK_URL}

      # ENVIRONMENT: ${ENVIRONMENT}
      # DJANGO_API_KEY: ${DJANGO_API_KEY}
      # RABBITMQ_URL: ${RABBITMQ_URL}

      # AUTH_SECRET: ${AUTH_SECRET}

      # CONDUTOR_PATH: ${CONDUTOR_PATH}
      # INDEXER_NETWORK_PATH: ${INDEXER_NETWORK_PATH}
      # SUPPLY_NETWORK_PATH: ${SUPPLY_NETWORK_PATH}

      # CHROME_PATH: ${CHROME_PATH}

    restart: unless-stopped

    networks:
      - infra

    # volumes:
    #   -

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8080:8080"
    env_file:
      - ./evolution/.env.production
    environment:
      DOCKER_ENV: "true"

    volumes:
      - ./evolution:/evolution/instances
    networks:
      - infra

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./evolution/redis:/data
    networks:
      - infra

  kestra:
    build:
      context: ./kestra
      dockerfile: Dockerfile
    container_name: kestra
    restart: unless-stopped

    ports:
      - "8081:8080"

    user: root

    environment:
      SECRET_KESTRA_EXTERNAL_API_KEY: ${KESTRA_EXTERNAL_API_KEY}

      KESTRA_CONFIGURATION: |
        micronaut:
          io:
            watch:
              enabled: true
              paths:
                - /flows

    volumes:
      - ./kestra/flows:/flows
      - ./kestra/storage:/app/storage
      - ./kestra/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp

    command: server local

    networks:
      - infra

networks:
  infra:
    external: true
